# Music preset schema (read by vsaudio.score.arranger; validated by load_preset)
# ---------------------------------------------------------------------------
# name, description        strings
# key                      informational ("D major")
# bpm                      number; a job's music.bpm overrides it. beat = 60/bpm, bar = 4 beats.
# chords                   {symbol: {pad: [notes], arp: [4 notes], bass: note}}
#                          notes are scientific pitch names: C#4, Bb2 ... (A4 = 440 Hz)
# progressions             {section kind: [chord symbols]} for tension|build|reveal|groove|breath|resolve.
#                          The index restarts at each section and advances one chord per bar (cycling).
# sections                 {section kind: {layer: options}}. A missing / null layer is off. Layers:
#   pads      gain, cutoff (Hz, or [from, to] interpolated bar by bar across the section),
#             sweep (bool: sweep each bar's LP towards the next bar's cutoff), attack, release,
#             first_attack (attack for the section's first bar), add_top (bool: add the arp's top note)
#   ticks     gain, gain_fast, fast_from (fraction of the section after which ticks go to eighths),
#             stop_beats (stop this many beats before the section end), pan
#   sub_pulse gain, stop_beats                       (sine sub on every beat, on the chord's bass note)
#   arp       gain, rate (notes per bar: 8 or 16), pattern (indices into the chord's arp notes),
#             damp, bright (Karplus-Strong), dur (s), accent (gain of off-beat notes), from_bar,
#             stop_beats, pan
#   shimmer   gain, rate, pattern, octave, ratio, index, decay, dur  (FM-bell arp, ramps 0.6 -> 1)
#   kick      gain, beats ([0..3] within each bar), from_bar
#   clap      gain, beats, from_bar
#   hats      gain, rate (8 or 16), velocities (per step within a beat), open ([beat, step] or null),
#             from_frac (fraction of the section after which hats start), pan
#   bass      gain, rate (notes per bar: 2, 4 or 8), octave_every (0 = never), length (fraction of the
#             note slot), from_bar
#   melody    gain, min_bars (only when the section is at least this long). Uses the top-level melody.
# melody                   notes: [names], beats: [beat offsets within a bar], ratio, index, decay, dur, pan
# hits                     riser_gain, riser_tail_gain, iris_riser_gain, impact_gain, impact_size,
#                          snare_roll (bool), roll_gain
# final_chord              pad: [notes] (ring-out pad), bells: [notes] (bell chord on the final hit),
#                          kick_gain, impact_gain, bell_gain, pad_gain
# bus_targets              {pads, arps, keys, bass, drums, fx}: RMS dBFS each bus is automixed to
# ---------------------------------------------------------------------------
# uplifting-tech: the LuraPlus launch score (REFERENCE §6.3). D major, 96 BPM, I-V-vi-IV groove,
# Bm/G tension intro, D/G reveal.
name: uplifting-tech
description: Bright, driving tech-launch score. Tension intro, big reveal, four-on-the-floor groove.
key: D major
bpm: 96

chords:
  D:  {pad: [D3, A3, E4, "F#4"],  arp: [D4, "F#4", A4, E5],  bass: D2}
  A:  {pad: [A2, E3, "C#4", B4],  arp: ["C#4", E4, A4, B4],  bass: A1}
  B:  {pad: [B2, "F#3", D4, A4],  arp: [B3, D4, "F#4", A4],  bass: B1}
  G:  {pad: [G2, D3, B3, "F#4"],  arp: [B3, D4, G4, "F#4"],  bass: G1}
  Bm: {pad: [B2, "F#3", D4, "C#4"], arp: [B3, D4, "F#4", "C#5"], bass: B1}
  Gi: {pad: [G2, D3, B3, "F#4"],  arp: [G3, B3, D4, "F#4"],  bass: G1}

progressions:
  tension: [Bm, Bm, Gi, Bm, Gi, Bm]
  build:   [B, G]
  reveal:  [D, G]
  groove:  [D, A, B, G]
  breath:  [B, G]
  resolve: [D, A, B, G]

sections:
  tension:
    pads: {gain: 0.55, cutoff: [500, 1100], attack: 1.2}
    ticks: {gain: 0.13, gain_fast: 0.16, fast_from: 0.67, stop_beats: 2.4, pan: 0.25}
    sub_pulse: {gain: 0.5, stop_beats: 2.5}
    arp: {gain: 0.32, rate: 8, pattern: [0, 2, 1, 3, 2, 1, 0, 2], damp: 0.985, bright: 0.35, dur: 0.5,
          accent: 1.0, from_bar: 1, stop_beats: 3.2, pan: 0.3}
  build:
    pads: {gain: 0.6, cutoff: [700, 3200], sweep: true, attack: 0.5}
    arp: {gain: 0.3, rate: 16, pattern: [0, 2, 1, 3, 2, 0, 3, 1, 0, 2, 1, 3, 2, 3, 1, 2], damp: 0.993,
          bright: 0.55, dur: 0.45, accent: 0.7, pan: 0.35}
    hats: {gain: 0.55, rate: 16, velocities: [0.35, 0.18, 0.55, 0.2], open: null, from_frac: 0.5, pan: 0.35}
  reveal:
    pads: {gain: 0.8, cutoff: 2600, attack: 0.6, first_attack: 0.05, release: 3.0, add_top: true}
    shimmer: {gain: 0.12, rate: 16, pattern: [0, 1, 2, 3, 3, 2, 1, 2], octave: 1, ratio: 3.0, index: 0.6,
              decay: 0.35, dur: 1.0}
  groove:
    pads: {gain: 0.62, cutoff: 2000, attack: 0.35}
    kick: {gain: 0.9, beats: [0, 1, 2, 3]}
    clap: {gain: 0.42, beats: [1, 3], from_bar: 2}
    hats: {gain: 0.55, rate: 16, velocities: [0.35, 0.18, 0.55, 0.2], open: [3, 2], pan: 0.35}
    bass: {gain: 0.42, rate: 8, octave_every: 4, length: 0.85, from_bar: 1}
    arp: {gain: 0.36, rate: 16, pattern: [0, 2, 1, 3, 2, 0, 3, 1, 0, 2, 1, 3, 2, 3, 1, 2], damp: 0.993,
          bright: 0.55, dur: 0.45, accent: 0.7, pan: 0.35}
    melody: {gain: 0.075, min_bars: 8}
  breath:
    pads: {gain: 0.6, cutoff: 1400, attack: 0.5}
    hats: {gain: 0.5, rate: 16, velocities: [0.35, 0.18, 0.55, 0.2], open: null, pan: 0.35}
    arp: {gain: 0.3, rate: 16, pattern: [0, 2, 1, 3, 2, 0, 3, 1, 0, 2, 1, 3, 2, 3, 1, 2], damp: 0.993,
          bright: 0.55, dur: 0.45, accent: 0.7, pan: 0.35}
  resolve:
    pads: {gain: 0.72, cutoff: 2800, attack: 0.2}
    kick: {gain: 0.9, beats: [0, 1, 2, 3]}
    clap: {gain: 0.42, beats: [1, 3]}
    hats: {gain: 0.55, rate: 16, velocities: [0.35, 0.18, 0.55, 0.2], open: [3, 2], pan: 0.35}
    bass: {gain: 0.42, rate: 8, octave_every: 4, length: 0.85}
    arp: {gain: 0.4, rate: 16, pattern: [0, 2, 1, 3, 2, 0, 3, 1, 0, 2, 1, 3, 2, 3, 1, 2], damp: 0.993,
          bright: 0.55, dur: 0.45, accent: 0.7, pan: 0.35}
    melody: {gain: 0.075, min_bars: 8}

melody:
  notes: ["F#5", E5, D5, E5, "C#5", A4, B4, D5, "F#5", E5, D5, B4]
  beats: [0, 1.5, 3]
  ratio: 3.0
  index: 1.0
  decay: 0.55
  dur: 1.4
  pan: 0.2

hits:
  riser_gain: 0.55
  riser_tail_gain: 0.35
  iris_riser_gain: 0.32
  impact_gain: 0.95
  impact_size: 1.3
  snare_roll: true
  roll_gain: 0.6

final_chord:
  pad: [D3, A3, E4, "F#4", A4, D5]
  bells: [D5, "F#5", A5, E6]
  kick_gain: 1.0
  impact_gain: 0.6
  bell_gain: 0.12
  pad_gain: 0.95

bus_targets: {pads: -21.0, arps: -25.0, keys: -29.0, bass: -23.0, drums: -22.5, fx: -24.0}
